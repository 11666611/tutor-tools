<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课后总结 · 家长报告</title>
<script>MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]}}</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>:root{--bg:#f8f7f4;--card:#ffffff;--blue:#5b7cf5;--green:#4ade80;--orange:#fb923c;--red:#f87171;--text:#1e293b;--muted:#94a3b8;--border:#e8e4df;--shadow:0 2px 24px rgba(0,0,0,.06);--radius:16px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#fefdfb,#f0f2f8,#f8f5ff);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}.wrap{max-width:640px;width:100%}.header{text-align:center;padding:28px 0 16px}.header .icon{font-size:2.5em;margin-bottom:4px}.header h1{font-size:1.5em;font-weight:800}.header p{color:var(--muted);font-size:.85em;margin-top:4px}.card{background:var(--card);border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}.card h3{font-size:1em;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}.card h3 .dot{width:10px;height:10px;border-radius:50%}label{display:block;font-size:.88em;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;font-size:.95em;font-family:inherit;background:#fafaf9;color:var(--text);transition:all .2s;-webkit-appearance:none}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,124,245,.08);background:#fff}textarea{resize:vertical;min-height:64px;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.stars{display:flex;gap:6px;font-size:1.7em;cursor:pointer;user-select:none}.stars .star{color:#ddd;transition:all .15s;padding:2px}.stars .star.on{color:var(--orange)}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:9px 16px;border-radius:22px;border:1.5px solid var(--border);font-size:.86em;background:#fafaf9;cursor:pointer;transition:all .2s;user-select:none;min-height:42px;display:flex;align-items:center}.tag:active{transform:scale(.95)}.tag.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}.tag.t1.on{background:var(--green);border-color:var(--green)}.tag.t2.on{background:var(--orange);border-color:var(--orange)}.tag.t3.on{background:var(--red);border-color:var(--red)}.btn-bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btn{flex:1;min-width:110px;padding:14px 20px;border-radius:26px;border:none;font-size:.95em;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;min-height:48px}.btn:active{transform:scale(.96)}.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(91,124,245,.25)}.btn-ghost{background:#fff;color:var(--red);border:2px solid var(--red)}.report{display:none;background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);border:2px solid var(--green)}.report.show{display:block}.report-header{text-align:center;border-bottom:2px solid var(--blue);padding-bottom:14px;margin-bottom:14px}.report-header .sname{font-size:1.4em;font-weight:800}.report-header .meta{font-size:.88em;color:var(--muted);margin-top:2px}.rs{margin-bottom:14px}.rs h4{font-size:.92em;color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:4px}.rs p{font-size:.92em;line-height:1.7}.rs .hl{background:rgba(91,124,245,.04);padding:10px 14px;border-radius:10px;border-left:3px solid var(--blue)}.report-footer{text-align:center;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:.82em;line-height:1.6}.copy-box{background:#f0f2f8;border-radius:10px;padding:14px;font-size:.82em;line-height:1.7;max-height:180px;overflow-y:auto;user-select:all;margin-top:10px;white-space:pre-wrap}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 28px;border-radius:26px;font-weight:600;font-size:.9em;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}@media(max-width:480px){body{padding:12px 8px}.card,.report{padding:16px 14px}}</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="icon">📋</div><h1>课后总结 · 家长报告</h1><p>填写 → 生成报告 → 一键复制发送</p></div>
<div id="form">
<div class="card"><h3><span class="dot" style="background:var(--blue)"></span>基本信息</h3><div class="row"><div><label>学生姓名</label><input id="sn" placeholder="学生姓名"></div><div><label>日期</label><input type="date" id="dt"></div></div><div class="row"><div><label>科目</label><select id="sb"><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>语文</option><option>其他</option></select></div><div><label>课时</label><input type="number" id="hr" value="2" min="0.5" max="8" step="0.5"></div></div></div>
<div class="card"><h3><span class="dot" style="background:var(--purple)"></span>教学内容</h3><label>本节课知识点</label><textarea id="tp" placeholder="例：一元二次不等式解法、基本不等式求最值..."></textarea><label>掌握情况</label><div class="tags" id="dg"><span class="tag t1" data-v="excellent">🌟 优秀（90%+）</span><span class="tag t2" data-v="good">👍 良好（70-90%）</span><span class="tag t2" data-v="fair">📖 一般（50-70%）</span><span class="tag t3" data-v="poor">⚠ 需加强（<50%）</span></div></div>
<div class="card"><h3><span class="dot" style="background:var(--orange)"></span>课堂表现</h3><label>专注度</label><div class="stars" id="fs"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><p style="font-size:.8em;color:var(--muted);margin-top:2px" id="fl">点击评分</p><label>互动积极性</label><div class="stars" id="as"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><p style="font-size:.8em;color:var(--muted);margin-top:2px" id="al">点击评分</p><label>课堂亮点</label><textarea id="hl" placeholder="例：积极回答问题、思路清晰..."></textarea><label>需要改进</label><textarea id="wk" placeholder="例：审题不够仔细、计算容易出错..."></textarea></div>
<div class="card"><h3><span class="dot" style="background:var(--green)"></span>课后作业</h3><label>本次作业</label><textarea id="hw" placeholder="例：课本P45习题2.3第1-6题"></textarea></div>
<div class="btn-bar"><button class="btn btn-ghost" onclick="reset()">重新填写</button><button class="btn btn-go" onclick="gen()">生成家长报告</button></div>
</div>
<div class="report" id="rp"><div id="rc"></div><div style="margin-top:14px"><p style="font-size:.8em;color:var(--muted);text-align:center;margin-bottom:6px">复制下方文字 → 微信发给家长</p><div class="copy-box" id="ct"></div></div><div class="btn-bar"><button class="btn btn-go" onclick="copy()">一键复制文字</button><button class="btn btn-ghost" onclick="back()">返回修改</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var fs=0,as=0,diff='';
document.getElementById('dt').value=new Date().toISOString().split('T')[0];
function bindStars(id,setter,labelId,labels){var c=document.getElementById(id);c.querySelectorAll('.star').forEach(function(s){s.addEventListener('click',function(){var v=parseInt(this.dataset.v);setter(v);c.querySelectorAll('.star').forEach(function(x,i){x.classList.toggle('on',i<v)});document.getElementById(labelId).textContent=labels[v-1]})})}
bindStars('fs',function(v){fs=v},'fl',['走神','有些分心','一般','比较专注','非常专注']);
bindStars('as',function(v){as=v},'al',['完全不互动','偶尔回应','正常互动','积极发言','非常活跃']);
document.querySelectorAll('#dg .tag').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('#dg .tag').forEach(function(x){x.classList.remove('on')});this.classList.add('on');diff=this.dataset.v})});
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function gen(){var n=document.getElementById('sn').value.trim();if(!n){toast('请填写学生姓名');return}if(!fs){toast('请评价专注度');return}if(!diff){toast('请选择掌握情况');return}
var d=document.getElementById('dt').value,s=document.getElementById('sb').value,h=document.getElementById('hr').value,tops=document.getElementById('tp').value.trim()||'—',high=document.getElementById('hl').value.trim()||'—',weak=document.getElementById('wk').value.trim()||'—',home=document.getElementById('hw').value.trim()||'—';
var ml={excellent:'掌握扎实，正确率90%以上，能够灵活运用',good:'掌握良好，正确率70-90%，个别细节需巩固',fair:'基本理解，正确率50-70%，还需加强练习',poor:'掌握较弱，正确率不足50%，需要重点关注'};
var mt=ml[diff]||diff;
var html='<div class="report-header"><div class="sname">'+n+'</div><div class="meta">'+d+' · '+s+' · '+h+'小时</div></div><div class="rs"><h4>📖 教学内容</h4><p>'+tops+'</p></div><div class="rs"><h4>✅ 掌握情况</h4><p>'+mt+'</p></div><div class="rs"><h4>⭐ 课堂表现</h4><p>专注度：'+'★'.repeat(fs)+'☆'.repeat(5-fs)+' &emsp; 互动：'+'★'.repeat(as)+'☆'.repeat(5-as)+'</p></div>'+(high!=='—'?'<div class="rs"><h4>🌟 课堂亮点</h4><div class="hl"><p>'+high+'</p></div></div>':'')+(weak!=='—'?'<div class="rs"><h4>📌 需要加强</h4><div class="hl"><p>'+weak+'</p></div></div>':'')+'<div class="rs"><h4>📝 课后作业</h4><p>'+home+'</p></div><div class="report-footer">感谢您的信任与配合，有任何问题欢迎随时沟通。</div>';
document.getElementById('rc').innerHTML=html;
var txt=n+' 课后学习反馈\n'+d+' | '+s+' | '+h+'小时\n————————————\n学习内容：'+tops+'\n掌握情况：'+mt+'\n课堂表现：专注'+'★'.repeat(fs)+'☆'.repeat(5-fs)+' 互动'+'★'.repeat(as)+'☆'.repeat(5-as)+(high!=='—'?'\n表现亮点：'+high:'')+(weak!=='—'?'\n需要加强：'+weak:'')+'\n课后作业：'+home+'\n————————————\n感谢您的信任，有任何问题随时沟通。';
document.getElementById('ct').textContent=txt;document.getElementById('rp').classList.add('show');document.getElementById('rp').scrollIntoView({behavior:'smooth'})}
function copy(){var t=document.getElementById('ct').textContent;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('已复制！去微信粘贴发给家长')});return}var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制！去微信粘贴发给家长')}
function back(){document.getElementById('rp').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function reset(){if(!confirm('清空所有内容？'))return;document.querySelectorAll('#form input[type="text"],#form textarea').forEach(function(e){e.value=''});document.getElementById('dt').value=new Date().toISOString().split('T')[0];document.getElementById('hr').value='2';fs=0;as=0;diff='';document.querySelectorAll('.stars .star').forEach(function(s){s.classList.remove('on')});document.querySelectorAll('#dg .tag').forEach(function(t){t.classList.remove('on')});document.getElementById('fl').textContent='点击评分';document.getElementById('al').textContent='点击评分';document.getElementById('rp').classList.remove('show')}
</script>
</body>
</html>
