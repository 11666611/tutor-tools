<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>初中数学 · 圆</title>
<script>MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]}}</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>:root{--bg:#fef9f4;--card:#ffffff;--blue:#e8833a;--green:#5cb85c;--orange:#e8833a;--red:#e05555;--purple:#9b6b5a;--text:#3d2c1e;--muted:#a08c7a;--border:#f0e0d0;--radius:16px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1520;color:var(--text);min-height:100vh;padding:20px 16px;display:flex;flex-direction:column;align-items:center;position:relative}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(59,114,185,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(79,195,176,.03) 0%,transparent 50%);pointer-events:none;z-index:0}.wrap{position:relative;z-index:1}.wrap{max-width:760px;width:100%}.header{text-align:center;padding:30px 0 14px}.header h1{font-size:1.6em;font-weight:800}.topics{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}.tbtn{padding:10px 22px;border-radius:22px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-weight:600;font-size:.87em;cursor:pointer;transition:all .2s;font-family:inherit}.tbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 16px rgba(91,156,245,.25)}.stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;text-align:center;min-width:68px}.stat .n{font-size:1.4em;font-weight:700}.stat .l{font-size:.7em;color:var(--muted)}.name-row{display:flex;justify-content:center;margin-bottom:14px}.name-row input{max-width:260px;width:100%;padding:12px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:#fff;font-size:.9em;text-align:center;font-family:inherit;transition:.2s}.name-row input:focus{outline:none;border-color:var(--blue)}.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin-bottom:14px;position:relative}.qcard .qnum{position:absolute;top:-14px;left:20px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:700;padding:4px 14px;border-radius:16px;font-size:.82em;box-shadow:0 4px 12px rgba(91,156,245,.2)}.qcard .qsvg{text-align:center;margin:8px 0 12px}.qcard .qsvg svg{max-width:100%;height:auto}.qcard .qtxt{font-size:1.05em;margin:6px 0 16px;line-height:1.65}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.02);transition:all .15s;font-size:.95em;min-height:46px}.opt:active{transform:scale(.985)}.opt:hover{border-color:rgba(255,255,255,.2)}.opt.pick{border-color:var(--blue);background:rgba(91,156,245,.08)}.opt.ok{border-color:var(--green)!important;background:rgba(74,222,128,.08)!important}.opt.bad{border-color:var(--red)!important;background:rgba(248,113,113,.08)!important}.opt .cir{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:rgba(255,255,255,.06);flex-shrink:0}.opt.ok .cir{background:var(--green);color:#000}.opt.bad .cir{background:var(--red);color:#fff}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.9em;display:none;line-height:1.6}.fb.show{display:block}.fb.ok{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2)}.fb.bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2)}.btn{padding:11px 24px;border-radius:24px;cursor:pointer;font-size:.9em;border:none;font-weight:700;font-family:inherit;transition:all .15s;min-height:44px}.btn:active{transform:scale(.96)}.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(91,156,245,.25)}.btn-ghost{background:0 0;border:1.5px solid var(--border);color:var(--muted)}.fill-area{margin-top:16px}.fill-input,.sol-input{width:100%;padding:14px 18px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:.95em;font-family:inherit;transition:all .2s}.fill-input:focus,.sol-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,156,245,.08)}.sol-input{resize:vertical;min-height:80px;line-height:1.6}.commit-btn{margin-top:10px;padding:8px 20px;border-radius:20px;border:1.5px solid var(--blue);background:rgba(91,156,245,.06);color:var(--blue);font-weight:600;font-size:.85em;cursor:pointer;font-family:inherit;transition:all .15s}.commit-btn:hover{background:var(--blue);color:#fff}.btn-bar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center}.result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;text-align:center;display:none;margin-top:16px}.result .big{font-size:3.5em;margin-bottom:6px}.result .sc{font-size:2.4em;font-weight:800}.result .msg{font-size:.95em;color:var(--muted);margin:6px 0 16px;white-space:pre-line}@media(max-width:480px){body{padding:12px 8px}.header h1{font-size:1.3em}.qcard{padding:18px 14px}.opt{padding:12px 14px;font-size:.9em}}</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>初中数学 · 圆的性质</h1></div>
<div class="topics" id="topicBar"></div>
<div class="stats"><div class="stat blue"><div class="n" id="tq">0</div><div class="l">总题</div></div><div class="stat green"><div class="n" id="tc">0</div><div class="l">正确</div></div><div class="stat red"><div class="n" id="tw">0</div><div class="l">错误</div></div><div class="stat orange"><div class="n" id="tp">0%</div><div class="l">进度</div></div></div>
<div class="name-row"><input type="text" id="sname" placeholder="输入你的姓名" autocomplete="off"><script>var ln=localStorage.getItem('ws_name');if(ln)document.getElementById('sname').value=ln</script></div>
<div id="qarea"></div><div class="btn-bar" id="qbtns"></div>
<div class="result" id="rpanel"><div class="big" id="rem"></div><div class="sc" id="rsc"></div><div class="msg" id="rmsg"></div><button class="btn btn-go" onclick="restart()">重新练习</button></div></div>
<script>
var BLOB=localStorage.getItem('blob_url')||'https://jsonblob.com/api/jsonBlob/019fdab4-ce1e-7630-a111-3e1600fd8f63'
var banks={'有理数':[],'整式与因式分解':[],'一元一次方程':[],'二元一次方程组':[],'不等式与不等式组':[],'平面直角坐标系':[],'一次函数':[],'三角形':[],'全等三角形':[],'勾股定理':[],'四边形':[],
'圆':[],'相似':[],'二次函数':[],'统计与概率':[]};
var topic='',questions=[],idx=0,answers={},done=false;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){var x=[].concat(a);for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
function renderQ(){if(done||!questions.length)return;var q=questions[idx];var type=q.type||'choice';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';var hasAnswer=answers[q.id]!==undefined;var isCorrect=hasAnswer&&answers[q.id]===q.answer;var html='<div class="qcard"><div class="qnum">第'+(idx+1)+'/'+questions.length+'题</div>'+svg+'<div class="qtxt">'+esc(q.text)+'</div>';if(type==='choice'){html+='<div class="opts">'+q.options.map(function(o,i){return'<div class="opt'+(answers[q.id]===i?' pick':'')+(hasAnswer?(i===q.answer?' ok':(i===answers[q.id]&&!isCorrect?' bad':'')):'')+'" data-i="'+i+'"'+(hasAnswer?' style="pointer-events:none"':'')+'><div class="cir">'+'ABCD'[i]+'</div><span>'+esc(o)+'</span></div>'}).join('')+'</div>';html+='<div class="fb'+(hasAnswer?' show '+(isCorrect?'ok':'bad'):'')+'">'+(hasAnswer?(isCorrect?'✅ 正确！':'❌ 答案：<b>'+'ABCD'[q.answer]+'</b> — '+esc(q.options[q.answer]))+'. '+esc(q.tag||''):'')+'</div>'}else{var revealed=answers[q.id]==='self-right'||answers[q.id]==='self-wrong';var selfOk=answers[q.id]==='self-right';var ansText='✅ '+(type==='fill'?'正确答案：':'参考答案：')+'<b>'+esc(q.answer)+'</b>';html+='<div class="fill-area">';if(!revealed){html+='<button class="commit-btn" id="revealBtn" style="font-size:1em;padding:12px 24px">💡 查看答案</button>'}else{html+='<div class="fb show '+(selfOk?'ok':'bad')+'" style="margin-bottom:12px">'+ansText+(q.solution?'<br><small>📝 解析：'+esc(q.solution)+'</small>':'')+'</div>';html+='<div style="display:flex;gap:10px"><button class="commit-btn" id="btnRight" style="background:var(--green);color:#fff;border-color:var(--green)">✅ 我做对了</button><button class="commit-btn" id="btnWrong" style="background:var(--red);color:#fff;border-color:var(--red)">❌ 还需复习</button></div>'}html+='</div>'}html+='</div>';document.getElementById('qarea').innerHTML=html;if(type==='choice'&&!hasAnswer){document.querySelectorAll('.opt').forEach(function(o){o.addEventListener('click',function(){pick(parseInt(o.dataset.i))})})}if(!hasAnswer&&(type==='fill'||type==='solution')){var rb=document.getElementById('revealBtn');var br=document.getElementById('btnRight');var bw=document.getElementById('btnWrong');if(rb)rb.addEventListener('click',function(){selfReveal()});if(br)br.addEventListener('click',function(){selfAssess('self-right')});if(bw)bw.addEventListener('click',function(){selfAssess('self-wrong')})}renderBtns();updateStats()}
function selfReveal(){answers[questions[idx].id]='revealed';renderQ()}
function selfAssess(v){answers[questions[idx].id]=v;renderQ()}
function pick(i){var q=questions[idx];if(answers[q.id]!==undefined)return;answers[q.id]=i;renderQ()}
function renderBtns(){if(!questions.length){document.getElementById('qbtns').innerHTML='';return}var h='';if(idx>0)h+='<button class="btn btn-ghost" onclick="prev()">⬅ 上一题</button>';if(answers[questions[idx].id]===undefined)h+='<button class="btn btn-ghost" onclick="skip()">跳过</button>';if(idx<questions.length-1)h+='<button class="btn btn-go" onclick="next()">下一题 ➡</button>';else h+='<button class="btn btn-go" onclick="finish()">交卷</button>';document.getElementById('qbtns').innerHTML=h}
function next(){if(idx<questions.length-1){idx++;renderQ()}}
function prev(){if(idx>0){idx--;renderQ()}}
function skip(){if(answers[questions[idx].id]===undefined)answers[questions[idx].id]=-1;next()}
function updateStats(){if(!questions.length){['tq','tc','tw','tp'].forEach(function(id){document.getElementById(id).textContent=id==='tp'?'0%':'0'});return}var t=0,c=0;questions.forEach(function(q){var ua=answers[q.id];if(ua===undefined||ua===-1||ua==='revealed')return;t++;if(ua===q.answer||ua==='self-right')c++});document.getElementById('tq').textContent=questions.length;document.getElementById('tc').textContent=c;document.getElementById('tw').textContent=t-c;document.getElementById('tp').textContent=Math.round(t/questions.length*100)+'%'}
function finish(){done=true;questions.forEach(function(q){var ua=answers[q.id];if(ua===undefined||ua==='revealed')answers[q.id]=-1});var correct=questions.filter(function(q){var ua=answers[q.id];return ua===q.answer||ua==='self-right'}).length;var total=questions.length,pct=Math.round(correct/total*100);var name=document.getElementById('sname').value.trim()||localStorage.getItem('ws_name')||'未填写';var wrongDetails=[];questions.forEach(function(q,i){var ua=answers[q.id];var type=q.type||'choice';if(type==='choice'){if(ua===q.answer||ua===-1)return;wrongDetails.push({num:i+1,text:q.text,tag:q.tag,userAnswer:ua>=0?q.options[ua]:'未作答',correctAnswer:q.options[q.answer]})}else{if(ua!=='self-wrong')return;wrongDetails.push({num:i+1,text:q.text,tag:q.tag,userAnswer:'自评未掌握',correctAnswer:q.answer})}});var allHtml='';questions.forEach(function(q,i){var ua=answers[q.id],type=q.type||'choice';var ok=ua===q.answer||ua==='self-right';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';allHtml+='<div class="qcard"><div class="qnum" style="background:'+(ok?'var(--green)':'var(--red)')+'">第'+(i+1)+'题 '+(ok?'✅':'❌')+'</div>'+svg+'<div class="qtxt">'+esc(q.text)+'</div>';if(type==='choice'){allHtml+='<div class="opts">'+q.options.map(function(o,j){return'<div class="opt'+(j===q.answer?' ok':'')+(j===ua&&!ok?' bad':'')+'" style="pointer-events:none"><div class="cir">'+'ABCD'[j]+'</div><span>'+esc(o)+'</span></div>'}).join('')+'</div>'}else{allHtml+='<div class="fill-area"><div style="font-size:.9em;margin:8px 0;color:var(--green)">✅ '+esc(q.answer)+'</div>'+(q.solution?'<div style="font-size:.82em;color:var(--muted)">📝 解析：'+esc(q.solution)+'</div>':'')+'<div style="font-size:.85em;margin-top:8px;color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✅ 自评：做对了':'❌ 自评：还需复习')+'</div></div>'}allHtml+='<div class="fb show '+(ok?'ok':'bad')+'">'+(ok?'✅ 正确！':'❌ 知识点：'+esc(q.tag||'未标注'))+'</div></div>'});document.getElementById('qarea').innerHTML=allHtml;document.getElementById('qbtns').innerHTML='';document.getElementById('rpanel').style.display='block';document.getElementById('rem').textContent=pct>=90?'🏆':pct>=70?'👍':pct>=50?'📖':'💪';document.getElementById('rsc').innerHTML='<span style="color:'+(pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)')+'">'+correct+'</span> / '+total;document.getElementById('rmsg').textContent=pct>=90?'太棒了！':pct>=70?'不错！':pct>=50?'还需努力':'要认真复习';updateStats();submitCloud(name,correct,total,pct,wrongDetails)}
function submitCloud(name,correct,total,pct,wrongDetails){var rec={type:'quiz',studentName:name,date:new Date().toISOString().split('T')[0],topic:topic,correct:correct,total:total,pct:pct,wrongDetails:wrongDetails,level:'junior',time:new Date().toLocaleString('zh-CN')};fetch(BLOB).then(function(r){return r.json()}).then(function(d){if(!d.items)d.items=[];d.items.unshift(rec);return fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}).then(function(){document.getElementById('rmsg').textContent+='\n✅ 已自动提交！'}).catch(function(){document.getElementById('rmsg').textContent+='\n⚠️ 提交失败'})}
function renderTopics(){var bar=document.getElementById('topicBar');bar.innerHTML='';var keys=Object.keys(banks).filter(function(k){return banks[k].length>0});if(!keys.length){bar.innerHTML='<span style="color:var(--muted);font-size:.85em">暂无题目</span>';return}keys.forEach(function(k,i){var b=document.createElement('button');b.className='tbtn'+(i===0?' on':'');b.textContent=k;b.addEventListener('click',function(){document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');topic=k;restart()});bar.appendChild(b)});if(keys.length>0){topic=keys[0];restart()}}
function restart(){questions=shuffle(banks[topic]||[]);idx=0;answers={};done=false;document.getElementById('rpanel').style.display='none';if(questions.length)renderQ();updateStats()}
renderTopics();
</script>
</body>
</html>
