function renderQ(){if(done||!questions.length)return;var q=questions[idx];var type=q.type||'choice';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';var hasAnswer=answers[q.id]!==undefined;var isCorrect=hasAnswer&&answers[q.id]===q.answer;var html='<div class="qcard"><div class="qnum">第'+(idx+1)+'/'+questions.length+'题</div>'+svg+'<div class="qtxt">'+q.text+'</div>';if(type==='choice'){html+='<div class="opts">'+q.options.map(function(o,i){return'<div class="opt'+(answers[q.id]===i?' pick':'')+(hasAnswer?(i===q.answer?' ok':(i===answers[q.id]&&!isCorrect?' bad':'')):'')+'" data-i="'+i+'"'+(hasAnswer?' style="pointer-events:none"':'')+'><div class="cir">'+'ABCD'[i]+'</div><span>'+o+'</span></div>'}).join('')+'</div>';html+='<div class="fb'+(hasAnswer?' show '+(isCorrect?'ok':'bad'):'')+'">'+(hasAnswer?(isCorrect?'✅ 正确！':'❌ 错误。正确答案：<b>'+'ABCD'[q.answer]+'</b> — '+q.options[q.answer])+'. '+(q.tag||''):'')+'</div>'}else if(type==='fill'){var curVal=typeof answers[q.id]==='string'?answers[q.id]:'';html+='<div class="fill-area"><input type="text" class="fill-input" id="textInput" placeholder="输入你的答案" value="'+curVal.replace(/"/g,'&quot;')+'"'+(hasAnswer?' disabled':'')+'>';if(!hasAnswer)html+='<button class="commit-btn" id="commitBtn">确认答案</button>';html+='</div>';html+='<div class="fb'+(hasAnswer?' show '+(isCorrect?'ok':'bad'):'')+'">'+(hasAnswer?(isCorrect?'✅ 正确！':'❌ 错误。正确答案：<b>'+q.answer+'</b>')+'. '+(q.tag||''):'')+'</div>'}else if(type==='solution'){var curVal2=typeof answers[q.id]==='string'?answers[q.id]:'';html+='<div class="fill-area"><textarea class="sol-input" id="textInput" placeholder="输入你的解答过程或最终答案" '+(hasAnswer?' disabled':'')+'>'+curVal2+'</textarea>';if(!hasAnswer)html+='<button class="commit-btn" id="commitBtn">提交答案</button>';html+='</div>';html+='<div class="fb'+(hasAnswer?' show '+(isCorrect?'ok':'bad'):'')+'">'+(hasAnswer?(isCorrect?'✅ 正确！':'❌ 参考答案：<b>'+q.answer+'</b>')+(q.solution?'<br><small>📝 解析：'+q.solution+'</small>':'')+'. '+(q.tag||''):'')+'</div>'}html+='</div>';document.getElementById('qarea').innerHTML=html;if(type==='choice'&&!hasAnswer){document.querySelectorAll('.opt').forEach(function(o){o.addEventListener('click',function(){pick(parseInt(o.dataset.i))})})}if((type==='fill'||type==='solution')&&!hasAnswer){var btn=document.getElementById('commitBtn');if(btn)btn.addEventListener('click',function(){commitTextAnswer(type)})}renderBtns();updateStats()}
function pick(i){var q=questions[idx];if(answers[q.id]!==undefined)return;answers[q.id]=i;renderQ()}
function commitTextAnswer(type){var q=questions[idx];if(answers[q.id]!==undefined)return;var el=document.getElementById('textInput');if(!el)return;var val=el.value.trim();if(!val){alert('请先输入答案');return}answers[q.id]=val;renderQ()}
function autoSaveCurrent(){if(done||!questions.length)return;var q=questions[idx];var type=q.type||'choice';if(answers[q.id]!==undefined)return;if(type==='fill'||type==='solution'){var el=document.getElementById('textInput');if(el&&el.value.trim())answers[q.id]=el.value.trim()}}
function renderBtns(){if(!questions.length){document.getElementById('qbtns').innerHTML='';return}var q=questions[idx],ans=answers[q.id]!==undefined,h='';if(idx>0)h+='<button class="btn btn-ghost" onclick="prev()">⬅ 上一题</button>';if(!ans)h+='<button class="btn btn-ghost" onclick="skip()">跳过</button>';if(idx<questions.length-1)h+='<button class="btn btn-go" onclick="next()">下一题 ➡</button>';else h+='<button class="btn btn-go" onclick="finish()">交卷</button>';document.getElementById('qbtns').innerHTML=h}
function next(){autoSaveCurrent();if(idx<questions.length-1){idx++;renderQ()}}
function prev(){autoSaveCurrent();if(idx>0){idx--;renderQ()}}
function skip(){autoSaveCurrent();if(answers[questions[idx].id]===undefined)answers[questions[idx].id]=-1;next()}
function updateStats(){if(!questions.length){['tq','tc','tw','tp'].forEach(function(id){document.getElementById(id).textContent=id==='tp'?'0%':'0'});return}var t=0,c=0;questions.forEach(function(q){var ua=answers[q.id];if(ua===undefined)return;if(ua===-1)return;t++;if(ua===q.answer)c++});document.getElementById('tq').textContent=questions.length;document.getElementById('tc').textContent=c;document.getElementById('tw').textContent=t-c;document.getElementById('tp').textContent=Math.round(t/questions.length*100)+'%'}
function finish(){done=true;questions.forEach(function(q){if(answers[q.id]===undefined)answers[q.id]=-1});var correct=questions.filter(function(q){return answers[q.id]===q.answer}).length;var total=questions.length,pct=Math.round(correct/total*100);var name=document.getElementById('sname').value.trim()||localStorage.getItem('ws_name')||'未填写';var wrongDetails=[];questions.forEach(function(q,i){var ua=answers[q.id];if(ua===q.answer||ua===-1)return;var type=q.type||'choice';var detail={num:i+1,text:q.text,tag:q.tag};if(type==='choice'){detail.userAnswer=ua>=0?q.options[ua]:'未作答';detail.correctAnswer=q.options[q.answer]}else{detail.userAnswer=ua||'未作答';detail.correctAnswer=q.answer}wrongDetails.push(detail)});var allHtml='';questions.forEach(function(q,i){var ua=answers[q.id],ok=ua===q.answer;var type=q.type||'choice';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';allHtml+='<div class="qcard"><div class="qnum" style="background:'+(ok?'var(--green)':'var(--red)')+'">第'+(i+1)+'题 '+(ok?'✅':'❌')+'</div>'+svg+'<div class="qtxt">'+q.text+'</div>';if(type==='choice'){allHtml+='<div class="opts">'+q.options.map(function(o,j){return'<div class="opt'+(j===q.answer?' ok':'')+(j===ua&&!ok?' bad':'')+'" style="pointer-events:none"><div class="cir">'+'ABCD'[j]+'</div><span>'+o+'</span></div>'}).join('')+'</div>'}else if(type==='fill'){allHtml+='<div class="fill-area"><input type="text" class="fill-input" value="'+(typeof ua==='string'?ua.replace(/"/g,'&quot;'):'未作答')+'" disabled style="border-color:'+(ok?'var(--green)':'var(--red)')+'"><div style="font-size:.85em;margin-top:6px;color:var(--green)">✅ 正确答案：'+q.answer+'</div></div>'}else if(type==='solution'){allHtml+='<div class="fill-area"><textarea class="sol-input" disabled style="border-color:'+(ok?'var(--green)':'var(--red)')+'">'+(typeof ua==='string'?ua:'未作答')+'</textarea><div style="font-size:.85em;margin-top:6px;color:var(--green)">✅ 参考答案：'+q.answer+'</div>'+(q.solution?'<div style="font-size:.82em;margin-top:4px;color:var(--muted)">📝 解析：'+q.solution+'</div>':'')+'</div>'}allHtml+='<div class="fb show '+(ok?'ok':'bad')+'">'+(ok?'✅ 正确！':'❌ 知识点：'+(q.tag||'未标注'))+'</div></div>'});document.getElementById('qarea').innerHTML=allHtml;document.getElementById('qbtns').innerHTML='';var panel=document.getElementById('rpanel');panel.style.display='block';document.getElementById('rem').textContent=pct>=90?'🏆':pct>=70?'👍':pct>=50?'📖':'💪';document.getElementById('rsc').innerHTML='<span style="color:'+(pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)')+'">'+correct+'</span> / '+total;document.getElementById('rmsg').textContent=pct>=90?'太棒了！':pct>=70?'不错！':pct>=50?'还需努力':'要认真复习';updateStats();submitCloud(name,correct,total,pct,wrongDetails)}
function submitCloud(name,correct,total,pct,wrongDetails){var rec={type:'quiz',studentName:name,date:new Date().toISOString().split('T')[0],topic:topicLabels[topic]||topic,topicKey:topic,correct:correct,total:total,pct:pct,wrongDetails:wrongDetails,level:'senior',time:new Date().toLocaleString('zh-CN')};fetch(BLOB).then(function(r){return r.json()}).then(function(d){if(!d.items)d.items=[];d.items.unshift(rec);return fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}).then(function(){document.getElementById('rmsg').textContent+='\n✅ 已自动提交！'}).catch(function(){document.getElementById('rmsg').textContent+='\n⚠️ 提交失败，请重试'})}
function renderTopics(){var bar=document.getElementById('topicBar');bar.innerHTML='';var keys=Object.keys(banks).filter(function(k){return banks[k].length>0});if(!keys.length){bar.innerHTML='<span style="color:var(--muted);font-size:.85em">暂无题目，等待老师添加</span>';document.getElementById('qarea').innerHTML='';document.getElementById('qbtns').innerHTML='';return}keys.forEach(function(k,i){var b=document.createElement('button');b.className='tbtn'+(i===0?' on':'');b.textContent=(topicLabels[k]||k)+' ('+banks[k].length+')';b.addEventListener('click',function(){document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');topic=k;restart()});bar.appendChild(b)});if(keys.length>0){topic=keys[0];restart()}}
function restart(){questions=shuffle(banks[topic]||[]);idx=0;answers={};done=false;document.getElementById('rpanel').style.display='none';if(questions.length)renderQ();updateStats()}
// 从云端加载题库（老师通过题库管理页面添加的题）
function loadBanks(){
  fetch(BLOB).then(function(r){return r.json()}).then(function(d){
    var cloudBank=d.questionBank;
    if(cloudBank&&Object.keys(cloudBank).length>0){
      // 云端题库覆盖本地（云端优先），但保留本地题库中没有的专题
      Object.keys(cloudBank).forEach(function(k){
        banks[k]=cloudBank[k];
        if(!topicLabels[k]) topicLabels[k]=k;
      });
    }
    renderTopics();
  }).catch(function(){
    // 网络失败，用本地题库
    renderTopics();
  });
}
loadBanks();
</script>
