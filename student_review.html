<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课后总结评价</title>
<script>MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]}}</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>:root{--bg:#f8f7f4;--card:#ffffff;--blue:#5b7cf5;--green:#4ade80;--orange:#fb923c;--red:#f87171;--purple:#a78bfa;--text:#1e293b;--muted:#94a3b8;--border:#e8e4df;--shadow:0 2px 24px rgba(0,0,0,.06);--radius:16px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#fefdfb,#f0f2f8,#f8f5ff);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}.wrap{max-width:640px;width:100%}.header{text-align:center;padding:28px 0 16px}.header .icon{font-size:2.8em;margin-bottom:4px}.header h1{font-size:1.5em;font-weight:800;letter-spacing:-.3px}.header p{color:var(--muted);font-size:.85em;margin-top:4px}.card{background:var(--card);border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}.card h3{font-size:1em;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}.card h3 .dot{width:10px;height:10px;border-radius:50%;display:inline-block}label{display:block;font-size:.88em;font-weight:600;margin:12px 0 5px;color:var(--text)}input,select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;font-size:.95em;font-family:inherit;background:#fafaf9;color:var(--text);transition:all .2s;-webkit-appearance:none}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,124,245,.08);background:#fff}textarea{resize:vertical;min-height:72px;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.stars{display:flex;gap:6px;font-size:1.8em;user-select:none}.stars .star{color:#ddd;transition:all .15s;padding:2px;cursor:pointer}.stars .star.on{color:var(--orange);transform:scale(1.12)}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:9px 16px;border-radius:22px;border:1.5px solid var(--border);font-size:.86em;background:#fafaf9;transition:all .2s;user-select:none;min-height:42px;display:flex;align-items:center;cursor:pointer}.tag:active{transform:scale(.95)}.tag.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}.tag.t1.on{background:var(--green);border-color:var(--green)}.tag.t2.on{background:var(--orange);border-color:var(--orange)}.tag.t3.on{background:var(--red);border-color:var(--red)}.btn-bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btn{flex:1;min-width:110px;padding:14px 20px;border-radius:26px;border:none;font-size:.95em;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;min-height:48px}.btn:active{transform:scale(.96)}.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(91,124,245,.25)}.btn-clear{background:#fff;color:var(--red);border:2px solid var(--red)}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 28px;border-radius:26px;font-weight:600;font-size:.9em;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.15)}.toast.show{opacity:1}@media(max-width:480px){body{padding:12px 8px}.card{padding:16px 14px}}</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="icon">📝</div><h1>课后总结评价</h1><p>提交后老师立刻看到</p></div>
<div class="card"><h3><span class="dot" style="background:var(--blue)"></span>基本信息</h3><div class="row"><div><label>姓名</label><input id="sn" placeholder="你的姓名" autocomplete="off"><script>var ln=localStorage.getItem('ws_name');if(ln)document.getElementById('sn').value=ln</script></div><div><label>日期</label><input type="date" id="dt"></div></div><div class="row"><div><label>科目</label><select id="sb"><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>语文</option><option>其他</option></select></div><div><label>课时</label><input type="number" id="hr" value="2" min="0.5" max="8" step="0.5"></div></div></div>
<div class="card"><h3><span class="dot" style="background:var(--purple)"></span>课堂内容</h3><label>学习了哪些知识点</label><textarea id="tp" placeholder="例：一元二次不等式解法、基本不等式求最值..."></textarea><label>难度评价</label><div class="tags" id="dg"><span class="tag t1" data-v="easy">😊 简单</span><span class="tag t2" data-v="medium">🤔 适中</span><span class="tag t3" data-v="hard">😰 困难</span></div></div>
<div class="card"><h3><span class="dot" style="background:var(--orange)"></span>自我评价</h3><label>掌握程度</label><div class="stars" id="ms"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><p style="font-size:.82em;color:var(--muted);margin-top:3px" id="ml">点击评分</p><label>课堂专注度</label><div class="stars" id="fs"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><p style="font-size:.82em;color:var(--muted);margin-top:3px" id="fl">点击评分</p><label>不懂的地方</label><textarea id="df" placeholder="哪些还没完全理解？老师会看到..."></textarea></div>
<div class="card"><h3><span class="dot" style="background:var(--green)"></span>作业</h3><label>作业完成情况</label><div class="tags" id="hg"><span class="tag" data-v="全部完成">✅ 全部完成</span><span class="tag" data-v="部分完成">📝 部分完成</span><span class="tag" data-v="未完成">❌ 未完成</span></div></div>
<div class="btn-bar"><button class="btn btn-clear" onclick="reset()">重新填写</button><button class="btn btn-go" onclick="submit()">提交评价</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
var BLOB='https://jsonblob.com/api/jsonBlob/019fd2b7-4376-7e01-aad8-0390e6b2fbce'
var ms=0,fs=0,diff='',hw='';
document.getElementById('dt').value=new Date().toISOString().split('T')[0];
function bindStars(id,setter,labelId,labels){var c=document.getElementById(id);c.querySelectorAll('.star').forEach(function(s){s.addEventListener('click',function(){var v=parseInt(this.dataset.v);setter(v);c.querySelectorAll('.star').forEach(function(x,i){x.classList.toggle('on',i<v)});document.getElementById(labelId).textContent=labels[v-1]})})}
bindStars('ms',function(v){ms=v},'ml',['😰 完全不懂','😣 懂了一点','🤔 差不多','😊 基本掌握','🎉 完全掌握']);
bindStars('fs',function(v){fs=v},'fl',['😴 走神','🥱 分心','🙂 一般','😊 专注','🔥 非常专注']);
function bindTags(id,setter){document.getElementById(id).querySelectorAll('.tag').forEach(function(t){t.addEventListener('click',function(){document.getElementById(id).querySelectorAll('.tag').forEach(function(x){x.classList.remove('on')});this.classList.add('on');setter(this.dataset.v)})})}
bindTags('dg',function(v){diff=v});bindTags('hg',function(v){hw=v});
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
window.submit=function(){var name=document.getElementById('sn').value.trim()||localStorage.getItem('ws_name');if(!name){toast('请填写姓名');return}if(!ms){toast('请给掌握程度打分');return}if(!fs){toast('请给专注度打分');return}if(!diff){toast('请选择难度');return}var rec={type:'eval',studentName:name,date:document.getElementById('dt').value,subject:document.getElementById('sb').value,hours:parseFloat(document.getElementById('hr').value)||2,topics:document.getElementById('tp').value.trim(),difficulty:diff,mastery:ms,focus:fs,difficulties:document.getElementById('df').value.trim(),homework:hw,time:new Date().toLocaleString('zh-CN')};fetch(BLOB).then(function(r){return r.json()}).then(function(d){if(!d.items)d.items=[];d.items.unshift(rec);return fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}).then(function(){toast('已提交！老师已收到')}).catch(function(){toast('提交失败，请重试')})};
window.reset=function(){document.querySelectorAll('input[type="text"],textarea').forEach(function(e){e.value=''});document.getElementById('dt').value=new Date().toISOString().split('T')[0];document.getElementById('hr').value='2';ms=0;fs=0;diff='';hw='';document.querySelectorAll('.stars .star').forEach(function(s){s.classList.remove('on')});document.querySelectorAll('.tags .tag').forEach(function(t){t.classList.remove('on')});document.getElementById('ml').textContent='点击评分';document.getElementById('fl').textContent='点击评分'};
</script>
</body>
</html>
