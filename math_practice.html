;padding:12px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:.9em;text-align:center;font-family:inherit;transition:.2s}.name-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(232,131,58,.08)}.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin-bottom:14px;position:relative;box-shadow:0 2px 12px rgba(180,140,100,.05)}.qcard .qnum{position:absolute;top:-14px;left:20px;background:linear-gradient(135deg,var(--blue),#d4722e);color:#fff;font-weight:700;padding:4px 14px;border-radius:16px;font-size:.82em;box-shadow:0 4px 12px rgba(232,131,58,.2)}.qcard .qsvg{text-align:center;margin-bottom:12px}.qcard .qtxt{font-size:1.05em;margin:6px 0 16px;line-height:1.65}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;cursor:pointer;border:1.5px solid var(--border);background:#fefaf6;transition:all .15s;font-size:.95em;min-height:46px}.opt:active{transform:scale(.985)}.opt:hover{border-color:var(--blue);background:rgba(232,131,58,.03)}.opt.pick{border-color:var(--blue);background:rgba(232,131,58,.06)}.opt.ok{border-color:var(--green)!important;background:rgba(92,184,92,.06)!important}.opt.bad{border-color:var(--red)!important;background:rgba(224,85,85,.06)!important}.opt .cir{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:rgba(232,131,58,.08);flex-shrink:0}.opt.ok .cir{background:var(--green);color:#fff}.opt.bad .cir{background:var(--red);color:#fff}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.9em;display:none;line-height:1.6}.fb.show{display:block}.fb.ok{background:rgba(92,184,92,.06);border:1px solid rgba(92,184,92,.2)}.fb.bad{background:rgba(224,85,85,.06);border:1px solid rgba(224,85,85,.2)}.btn{padding:11px 24px;border-radius:24px;curso var topic='',questions=[],idx=0,answers={},done=false;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
	function safeText(s){return esc(s).replace(/&lt;i&gt;/g,'<i>').replace(/&lt;/i&gt;/g,'</i>').replace(/&lt;sub&gt;/g,'<sub>').replace(/&lt;/sub&gt;/g,'</sub>').replace(/&lt;sup&gt;/g,'<sup>').replace(/&lt;/sup&gt;/g,'</sup>').replace(/&lt;br&gt;/g,'<br>').replace(/&lt;br/&gt;/g,'<br>')}

function shuffle(a){var x=[].concat(a);for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
function renderQ(){if(done||!questions.length)return;var q=questions[idx];var type=q.type||'choice';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';var hasAnswer=answers[q.id]!==undefined;var isCorrect=hasAnswer&&answers[q.id]===q.answer;var html='<div class="qcard"><div class="qnum">第'+(idx+1)+'/'+questions.length+'题</div>'+svg+'<div class="qtxt">'+safeText(q.text)+'</div>';if(type==='choice'){html+='<div class="opts">'+q.options.map(function(o,i){return'<div class="opt'+(answers[q.id]===i?' pick':'')+(hasAnswer?(i===q.answer?' ok':(i===answers[q.id]&&!isCorrect?' bad':'')):'')+'" data-i="'+i+'"'+(hasAnswer?' style="pointer-events:none"':'')+'><div class="cir">'+'ABCD'[i]+'</div><span>'+esc(o)+'</span></div>'}).join('')+'</div>';html+='<div class="fb'+(hasAnswer?' show '+(isCorrect?'ok':'bad'):'')+'">'+(hasAnswer?(isCorrect?'✅ 正确！':'❌ 错误。正确答案：<b>'+'ABCD'[q.answer]+'</b> — '+esc(q.options[q.answer]))+'. '+esc(q.tag||''):'')+'</div>'}else{var revealed=answers[q.id]==='self-right'||answers[q.id]==='self-wrong';var selfOk=answers[q.id]==='self-right';var ansText=type==='fill'?'正确答案：<b>'+esc(q.answer)+'</b>':'参考答案：<b>'+esc(q.answer)+'</b>';html+='<div class="fill-area">';if(!revealed){html+='<button class="commit-btn" id="revealBtn" style="font-size:1em;padding:12px 24px">💡 查看答案</button>'}else{html+='<div class="fb show '+(selfOk?'ok':'bad')+'" style="margin-bottom:12px">'+ansText+(q.solution?'<br><small>📝 解析：'+esc(q.solution)+'</small>':'')+'</div>';html+='<div style="display:flex;gap:10px"><button class="commit-btn" id="btnRight" style="background:var(--green);color:#fff;border-color:var(--green)">✅ 我做对了</button><button class="commit-btn" id="btnWrong" style="background:var(--red);color:#fff;border-color:var(--red)">❌ 还需复习</button></div>'}html+='</div>'}html+='</div>';document.getElementById('qarea').innerHTML=html;if(type==='choice'&&!hasAnswer){document.querySelectorAll('.opt').forEach(function(o){o.addEventListener('click',function(){pick(parseInt(o.dataset.i))})})}if(!hasAnswer&&(type==='fill'||type==='solution')){var rb=document.getElementById('revealBtn');var br=document.getElementById('btnRight');var bw=document.getElementById('btnWrong');if(rb)rb.addEventListener('click',function(){selfReveal()});if(br)br.addEventListener('click',function(){selfAssess('self-right')});if(bw)bw.addEventListener('click',function(){selfAssess('self-wrong')})}renderBtns();updateStats()}
function selfReveal(){answers[questions[idx].id]='revealed';renderQ()}
function selfAssess(v){answers[questions[idx].id]=v;renderQ()}
function renderBtns(){if(!questions.length){document.getElementById('qbtns').innerHTML='';return}var q=questions[idx],ans=answers[q.id]!==undefined,h='';if(idx>0)h+='<button class="btn btn-ghost" onclick="prev()">⬅ 上一题</button>';if(!ans)h+='<button class="btn btn-ghost" onclick="skip()">跳过</button>';if(idx<questions.length-1)h+='<button class="btn btn-go" onclick="next()">下一题 ➡</button>';else h+='<button class="btn btn-go" onclick="finish()">交卷</button>';document.getElementById('qbtns').innerHTML=h}
function next(){if(idx<questions.length-1){idx++;renderQ()}}
function prev(){if(idx>0){idx--;renderQ()}}
function skip(){if(answers[questions[idx].id]===undefined)answers[questions[idx].id]=-1;next()}
function updateStats(){if(!questions.length){['tq','tc','tw','tp'].forEach(function(id){document.getElementById(id).textContent=id==='tp'?'0%':'0'});return}var t=0,c=0;questions.forEach(function(q){var ua=answers[q.id];if(ua===undefined||ua===-1||ua==='revealed')return;t++;if(ua===q.answer||ua==='self-right')c++});document.getElementById('tq').textContent=questions.length;document.getElementById('tc').textContent=c;document.getElementById('tw').textContent=t-c;document.getElementById('tp').textContent=Math.round(t/questions.length*100)+'%'}
function finish(){done=true;questions.forEach(function(q){var ua=answers[q.id];if(ua===undefined||ua==='revealed')answers[q.id]=-1});var correct=questions.filter(function(q){var ua=answers[q.id];return ua===q.answer||ua==='self-right'}).length;var total=questions.length,pct=Math.round(correct/total*100);var name=document.getElementById('sname').value.trim()||localStorage.getItem('ws_name')||'未填写';var wrongDetails=[];questions.forEach(function(q,i){var ua=answers[q.id];var type=q.type||'choice';if(type==='choice'){if(ua===q.answer||ua===-1)return;wrongDetails.push({num:i+1,text:q.text,tag:q.tag,userAnswer:ua>=0?q.options[ua]:'未作答',correctAnswer:q.options[q.answer]})}else{if(ua!=='self-wrong')return;wrongDetails.push({num:i+1,text:q.text,tag:q.tag,userAnswer:'自评未掌握',correctAnswer:q.answer})}});var allHtml='';questions.forEach(function(q,i){var ua=answers[q.id],type=q.type||'choice';var ok=ua===q.answer||ua==='self-right';var svg=q.svg?'<div class="qsvg">'+q.svg+'</div>':'';allHtml+='<div class="qcard"><div class="qnum" style="background:'+(ok?'var(--green)':'var(--red)')+'">第'+(i+1)+'题 '+(ok?'✅':'❌')+'</div>'+svg+'<div class="qtxt">'+safeText(q.text)+'</div>';if(type==='choice'){allHtml+='<div class="opts">'+q.options.map(function(o,j){return'<div class="opt'+(j===q.answer?' ok':'')+(j===ua&&!ok?' bad':'')+'" style="pointer-events:none"><div class="cir">'+'ABCD'[j]+'</div><span>'+esc(o)+'</span></div>'}).join('')+'</div>'}else{allHtml+='<div class="fill-area"><div style="font-size:.9em;margin:8px 0;color:var(--green)">✅ '+esc(q.answer)+'</div>'+(q.solution?'<div style="font-size:.82em;color:var(--muted)">📝 解析：'+esc(q.solution)+'</div>':'')+'<div style="font-size:.85em;margin-top:8px;color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✅ 自评：做对了':'❌ 自评：还需复习')+'</div></div>'}allHtml+='<div class="fb show '+(ok?'ok':'bad')+'">'+(ok?'✅ 正确！':'❌ 知识点：'+esc(q.tag||'未标注'))+'</div></div>'});document.getElementById('qarea').innerHTML=allHtml;document.getElementById('qbtns').innerHTML='';var panel=document.getElementById('rpanel');panel.style.display='block';document.getElementById('rem').textContent=pct>=90?'🏆':pct>=70?'👍':pct>=50?'📖':'💪';document.getElementById('rsc').innerHTML='<span style="color:'+(pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)')+'">'+correct+'</span> / '+total;document.getElementById('rmsg').textContent=pct>=90?'太棒了！':pct>=70?'不错！':pct>=50?'还需努力':'要认真复习';updateStats();submitCloud(name,correct,total,pct,wrongDetails)}
function submitCloud(name,correct,total,pct,wrongDetails){var rec={type:'quiz',studentName:name,date:new Date().toISOString().split('T')[0],topic:topicLabels[topic]||topic,topicKey:topic,correct:correct,total:total,pct:pct,wrongDetails:wrongDetails,level:'senior',time:new Date().toLocaleString('zh-CN')};fetch(BLOB).then(function(r){return r.json()}).then(function(d){if(!d.items)d.items=[];d.items.unshift(rec);return fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}).then(function(){document.getElementById('rmsg').textContent+='\n✅ 已自动提交！'}).catch(function(){document.getElementById('rmsg').textContent+='\n⚠️ 提交失败，请重试'})}
function renderTopics(){var bar=document.getElementById('topicBar');bar.innerHTML='';var keys=Object.keys(banks).filter(function(k){return banks[k].length>0});if(!keys.length){bar.innerHTML='<span style="color:var(--muted);font-size:.85em">暂无题目，等待老师添加</span>';document.getElementById('qarea').innerHTML='';document.getElementById('qbtns').innerHTML='';return}keys.forEach(function(k,i){var b=document.createElement('button');b.className='tbtn'+(i===0?' on':'');b.textContent=(topicLabels[k]||k)+' ('+banks[k].length+')';b.addEventListener('click',function(){document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');topic=k;restart()});bar.appendChild(b)});if(keys.length>0){topic=keys[0];restart()}}
function restart(){questions=shuffle(banks[topic]||[]);idx=0;answers={};done=false;document.getElementById('rpanel').style.display='none';if(questions.length)renderQ();updateStats()}
// 从云端加载题库（老师通过题库管理页面添加的题）
function loadBanks(){
  fetch(BLOB).then(function(r){return r.json()}).then(function(d){
    var cloudBank=d.questionBank;
    if(cloudBank&&Object.keys(cloudBank).length>0){
      // 云端题库覆盖本地（云端优先），但保留本地题库中没有的专题
      Object.keys(cloudBank).forEach(function(k){
        banks[k]=cloudBank[k];
        if(!topicLabels[k]) topicLabels[k]=k;
      });
    }
    renderTopics();
  }).catch(function(){
    // 网络失败，用本地题库
    renderTopics();
  });
}
loadBanks();
</script>
