<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>教师看板</title>
<style>:root{--bg:#0a0a14;--card:rgba(255,255,255,.03);--blue:#5b9cf5;--green:#4ade80;--orange:#fb923c;--red:#f87171;--purple:#a78bfa;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(255,255,255,.08);--radius:16px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0a14,#141028,#0a1428);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}.wrap{max-width:900px;width:100%}.header{text-align:center;padding:20px 0 12px}.header h1{font-size:1.5em;font-weight:800}.header p{color:var(--muted);font-size:.82em;margin-top:2px}.top-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:14px}.top-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(10px)}.top-stat .n{font-size:1.6em;font-weight:700}.top-stat .l{font-size:.7em;color:var(--muted);margin-top:2px}.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;justify-content:center}.status{font-size:.78em;padding:6px 14px;border-radius:14px}.status.ok{background:rgba(74,222,128,.12);color:var(--green)}.status.err{background:rgba(248,113,113,.12);color:var(--red)}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;backdrop-filter:blur(10px)}.card h3{font-size:.95em;margin-bottom:12px;display:flex;align-items:center;gap:6px}.btn{padding:10px 20px;border-radius:22px;cursor:pointer;font-weight:700;font-size:.85em;border:none;font-family:inherit;transition:all .15s;min-height:40px}.btn:active{transform:scale(.96)}.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(91,156,245,.25)}.btn-green{background:var(--green);color:#000}.btn-red{background:0 0;color:var(--red);border:2px solid var(--red)}.stu-row{display:flex;align-items:center;gap:10px;padding:14px;background:rgba(0,0,0,.2);border-radius:12px;margin-bottom:6px;border:1px solid rgba(255,255,255,.04);cursor:pointer;flex-wrap:wrap;transition:all .15s}.stu-row:hover{border-color:rgba(255,255,255,.15)}.stu-row .s-name{font-weight:700;min-width:70px;font-size:.93em}.stu-row .s-info{color:var(--muted);font-size:.76em;flex:1;min-width:100px}.stu-row .s-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.7em;font-weight:700}.detail{display:none;background:rgba(0,0,0,.2);border-radius:12px;padding:16px;margin:4px 0 8px 14px;border:1px solid rgba(255,255,255,.06)}.detail.show{display:block}.sl{font-size:.78em;font-weight:600;margin:10px 0 6px;padding:4px 10px;border-radius:8px;display:inline-block}.sl.ql{background:rgba(91,156,245,.1);color:var(--blue)}.sl.el{background:rgba(74,222,128,.1);color:var(--green)}.sl.wl{background:rgba(248,113,113,.1);color:var(--red)}.rec{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.05);gap:8px;flex-wrap:wrap;font-size:.83em}.rec .r-date{color:var(--blue);font-weight:600;min-width:80px}.rec .r-body{flex:1;min-width:150px}.rec .r-score{text-align:right;min-width:100px}.rec .r-score .r-grade{font-size:1.05em;font-weight:700}.wtag{display:inline-block;background:rgba(248,113,113,.12);color:var(--red);padding:2px 8px;border-radius:6px;font-size:.75em;margin:2px 4px 2px 0}.weak-card{background:rgba(248,113,113,.05);border:1px solid rgba(248,113,113,.15);border-radius:10px;padding:12px;margin:8px 0}.weak-card h4{color:var(--red);font-size:.85em;margin-bottom:4px}.weak-card .rem-q{background:rgba(91,156,245,.06);padding:8px 12px;border-radius:8px;margin:4px 0;font-size:.82em}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:480px){body{padding:8px}.stu-row{flex-direction:column;align-items:flex-start;gap:6px}.rec{flex-direction:column}}</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>教师看板</h1><p>错题详情 · 薄弱分析 · 巩固例题</p></div>
<div class="top-stats" id="ts"></div>
<div class="toolbar"><span class="status" id="sync">连接中...</span><button class="btn btn-blue" onclick="refresh()">刷新</button><button class="btn btn-blue" onclick="resetSt()">重置存储</button><button class="btn btn-green" onclick="exportCSV()">导出CSV</button></div>
<div class="card"><h3>学生列表</h3><div id="list"><div class="empty">等待学生提交...</div></div></div>
</div>
<script>
var BLOB='https://jsonblob.com/api/jsonBlob/019fd2b7-4376-7e01-aad8-0390e6b2fbce'
var items=[];
var remedy={'垂径定理·综合计算':['CD是⊙O直径，弦AB⊥CD于E，AB=12，CE=3，求半径。','CD⊥AB于E，AB=20，OE=5，求直径CD。'],'垂径定理·圆材埋壁变式':['圆材埋壁：CD直径⊥AB于E，CE=3，AE=8，求直径。'],'圆周角定理·双解讨论':['弦AB所对圆心角120°，点C在优弧上，求∠ACB。','∠AOB=60°，C在⊙O上且不与A、B重合，求∠ACB的所有可能值。'],'圆周角推论·比例求角':['AB直径，∠ABC=22°，D是弧BC中点，求∠ABD。','AB直径，C在半圆上，∠CAB=40°，D是弧AC上一点，∠CBD=15°，求∠ABD。'],'垂径定理·平行弦距离':['⊙O半径13，弦AB∥CD，AB=24，CD=10，圆心在AB与CD之间，求两弦距离。'],'圆内接四边形·综合求角':['ABCD内接于⊙O，∠BAD=60°，O在四边形内部，连接OB、OD，∠BOD=140°，求∠BCD。'],'垂径定理·拱桥+水位变化':['拱桥跨度30m，拱高10m，水面上升3m，求水面宽度。'],'圆周角定理·构造辅助线':['⊙O中，弦AD与BC交于P，若∠APB=70°，弧AB=弧CD，求∠AOB。'],'圆周角+圆内接四边形综合':['AB直径，C在⊙O上，D为弧AC中点，BD交AC于E，∠CAB=25°，求∠AED。'],'垂径定理+勾股综合':['⊙O半径为15，弦AB=18，M为AB中点，过M作弦CD，CM=4，求MD。'],
'空集的定义与判定':['判断下列集合是否为空集：{x|x²+2=0,x∈R}','若A={x|mx+1=0}=∅，求m的值。'],
'空集的性质':['判断：∅⊆∅；∅∈{∅}；∅⊆{0}','写出集合{a}的所有子集，并指出哪些是真子集。'],
'子集个数公式·2ⁿ':['集合{1,2,3,4,5}的子集共有多少个？','若集合A有6个元素，求A的子集个数和真子集个数。'],
'真子集个数·2ⁿ-1':['集合{a,b,c,d}的真子集和非空真子集各有多少个？','已知集合A的子集个数为64，求A的元素个数。'],
'元素与集合、集合与集合关系':['设A={0,{1}}，判断：0∈A,{0}⊆A,{1}∈A,∅⊆A','用适当的符号(∈,∉,⊆,⊊,=)填空。'],
'满足条件的集合个数':['满足{a}⊆M⊊{a,b,c,d}的集合M有几个？','若{1,2}⊆A⊆{1,2,3,4,5}，求A的个数。'],
'集合相等·求参数':['A={2,a}，B={a²-2,3}，若A=B，求a。','A={x,xy,x-y}，B={0,|x|,y}，A=B，求x+y。'],
'含参集合为空集':['若A={x|ax²+ax+1=0}=∅，求a的范围。','集合A={x|(a-1)x²+3x-2=0}有且仅有一个元素，求a。'],
'无限集合关系·数轴法求参':['A={x|x<2或x>5}，B={x|x≤a}，A∪B=R，求a。','A=[1,4]，B=(-∞,a)，A∩B≠∅，求a。'],
'综合·集合关系+子集个数':['A={x∈Z|-3≤x<4}，求A的非空真子集个数。','集合{(x,y)|x+y=2,x,y∈N}的子集个数为？']
};

function refresh(){document.getElementById('sync').textContent='同步中...';document.getElementById('sync').className='status';fetch(BLOB).then(function(r){return r.json()}).then(function(d){items=d.items||[];document.getElementById('sync').textContent='已同步 '+items.length+'条';document.getElementById('sync').className='status ok';renderAll()}).catch(function(){document.getElementById('sync').textContent='连接失败';document.getElementById('sync').className='status err';renderAll()})}
function resetSt(){if(!confirm('重置云存储？'))return;fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({students:[],items:[],created:new Date().toISOString()})}).then(function(){items=[];refresh()})}
function gr(s){if(s>=90)return{g:'A+',c:'var(--green)'};if(s>=75)return{g:'A',c:'var(--green)'};if(s>=60)return{g:'B',c:'var(--orange)'};if(s>=40)return{g:'C',c:'var(--orange)'};return{g:'D',c:'var(--red)'}}
function ge(t){if(t>=4.5)return{g:'A+',c:'var(--green)'};if(t>=3.5)return{g:'A',c:'var(--green)'};if(t>=2.5)return{g:'B',c:'var(--orange)'};if(t>=1.5)return{g:'C',c:'var(--orange)'};return{g:'D',c:'var(--red)'}}
function weaks(qs){var m={};qs.forEach(function(q){if(!q.wrongDetails)return;q.wrongDetails.forEach(function(w){var t=w.tag||'其他';m[t]=(m[t]||0)+1})});return Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,5).map(function(k){return{tag:k,n:m[k]}})}
function renderAll(){
var qi=items.filter(function(e){return e.type==='quiz'}),ei=items.filter(function(e){return e.type==='eval'});var ns=[...new Set(items.map(function(e){return e.studentName}))];var aq=qi.length?Math.round(qi.reduce(function(s,e){return s+e.pct},0)/qi.length)+'%':'—',ae=ei.length?(ei.reduce(function(s,e){return s+e.mastery*.6+e.focus*.4},0)/ei.length).toFixed(1):'—';
document.getElementById('ts').innerHTML='<div class="top-stat"><div class="n" style="color:var(--blue)">'+ns.length+'</div><div class="l">学生数</div></div><div class="top-stat"><div class="n" style="color:var(--green)">'+qi.length+'</div><div class="l">练习</div></div><div class="top-stat"><div class="n" style="color:var(--yellow)">'+ei.length+'</div><div class="l">评价</div></div><div class="top-stat"><div class="n" style="color:var(--purple)">'+aq+'</div><div class="l">练习均分</div></div><div class="top-stat"><div class="n" style="color:var(--orange)">'+ae+'</div><div class="l">评价均分</div></div>';
if(!ns.length){document.getElementById('list').innerHTML='<div class="empty">等待学生提交...</div>';return}
document.getElementById('list').innerHTML=ns.sort().map(function(n){var sq=qi.filter(function(e){return e.studentName===n}),se=ei.filter(function(e){return e.studentName===n});var qa=sq.length?Math.round(sq.reduce(function(s,e){return s+e.pct},0)/sq.length):null,ea=se.length?(se.reduce(function(s,e){return s+e.mastery*.6+e.focus*.4},0)/se.length).toFixed(1):null;var wk=weaks(sq);var id='d-'+n.replace(/[\s#.]/g,'_');var h='<div class="stu-row" onclick="toggle(\''+id+'\')"><div class="s-name">🟢 '+n+'</div><div class="s-info">'+sq.length+'练 · '+se.length+'评</div><div class="s-stats">';if(qa!==null){var qg=gr(qa);h+='<span class="badge" style="background:'+qg.c+'20;color:'+qg.c+'">练习'+qa+'%</span>'}if(ea!==null){var eg=ge(parseFloat(ea));h+='<span class="badge" style="background:'+eg.c+'20;color:'+eg.c+'">评价'+ea+'</span>'}if(wk.length)h+='<span class="badge" style="background:rgba(248,113,113,.12);color:var(--red)">薄弱'+wk.length+'个</span>';h+='</div></div><div class="detail" id="'+id+'">';
if(sq.length){h+='<span class="sl ql">练习记录（'+sq.length+'次）</span>';sq.forEach(function(e){var g=gr(e.pct),lv=e.level==='junior'?'初中':'高中';h+='<div class="rec"><div class="r-date">'+e.date+'</div><div class="r-body"><span class="badge" style="background:rgba(167,139,250,.12);color:var(--purple);margin-right:4px">'+lv+'</span>'+e.topic+' · '+e.correct+'/'+e.total+'对';if(e.wrongDetails&&e.wrongDetails.length){h+='<div style="margin-top:4px">';e.wrongDetails.forEach(function(w){h+='<span class="wtag">题'+w.num+': '+w.tag+'</span>'});h+='</div>'}h+='</div><div class="r-score"><div class="r-grade" style="color:'+g.c+'">'+e.pct+'% '+g.g+'</div></div></div>'})}
if(wk.length){h+='<span class="sl wl">薄弱分析 & 巩固例题</span>';wk.forEach(function(w){h+='<div class="weak-card"><h4>'+w.tag+'（错'+w.n+'次）</h4>'+(remedy[w.tag]?remedy[w.tag].map(function(rq){return'<div class="rem-q">'+rq+'</div>'}).join(''):'<div class="rem-q">请布置此知识点额外练习</div>')+'</div>'})}
if(se.length){var dl={easy:'简单',medium:'适中',hard:'困难'};h+='<span class="sl el">课后评价（'+se.length+'次）</span>';se.forEach(function(e){var t=e.mastery*.6+e.focus*.4,g=ge(t);h+='<div class="rec"><div class="r-date">'+e.date+'</div><div class="r-body">'+e.subject+' · '+(e.topics||'—')+' · '+e.hours+'h'+(e.difficulties?'<div style="color:var(--red);font-size:.85em">'+e.difficulties+'</div>':'')+'</div><div class="r-score"><div class="r-grade" style="color:'+g.c+'">'+g.g+'</div><div class="r-meta">掌握'+e.mastery+' 专注'+e.focus+' '+(dl[e.difficulty]||'')+' '+e.homework+'</div></div></div>'})}h+='</div>';return h}).join('')}
window.toggle=function(id){var e=document.getElementById(id);if(e)e.classList.toggle('show')};
window.exportCSV=function(){if(!items.length)return;var c='类型,姓名,日期,主题,得分,错题\n';items.forEach(function(e){if(e.type==='quiz')c+='练习,"'+e.studentName+'","'+e.date+'","'+e.topic+'",'+e.pct+'%,"'+((e.wrongDetails||[]).map(function(w){return w.tag}).join(';'))+'"\n';else c+='评价,"'+e.studentName+'","'+e.date+'","'+e.subject+'","'+e.mastery+'/'+e.focus+'","'+e.difficulties+' '+e.homework+'"\n'});var b=new Blob(['﻿'+c],{type:'text/csv'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='看板_'+new Date().toISOString().split('T')[0]+'.csv';a.click()};
refresh();setInterval(refresh,30000);
</script>
</body>
</html>
