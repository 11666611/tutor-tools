<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>家教工作台</title>
<style>:root{--bg:#0f1923;--card:#1a2740;--sidebar:#152238;--primary:#3b72b9;--accent:#4fc3b0;--text:#e0e6ed;--muted:#7a8b9e;--border:#263548;--radius:14px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0d1520;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(59,114,185,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(79,195,176,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(123,143,206,.05) 0%,transparent 50%);pointer-events:none;z-index:0}.login-box{position:relative;z-index:1}.login-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 28px;box-shadow:0 4px 32px rgba(0,0,0,.25)}.login-box .logo{text-align:center;margin-bottom:32px}.login-box .logo .icon{font-size:3em;margin-bottom:6px}.login-box .logo h1{font-size:1.5em;font-weight:800;color:#fff}.login-box .logo p{color:var(--muted);font-size:.85em;margin-top:4px}label{display:block;font-size:.85em;font-weight:600;margin-bottom:6px;color:var(--muted)}input[type=text],input[type=password]{width:100%;padding:14px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1em;font-family:inherit;margin-bottom:16px;transition:all .2s}input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,114,185,.12)}.role-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.role-card{padding:20px 16px;border-radius:12px;border:2px solid var(--border);text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}.role-card:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,114,185,.1)}.role-card .r-icon{font-size:2.2em;margin-bottom:8px}.role-card .r-title{font-weight:700;font-size:1em}.role-card .r-desc{color:var(--muted);font-size:.78em;margin-top:4px}.role-card.sel{border-color:var(--primary);background:rgba(59,114,185,.1);box-shadow:0 0 24px rgba(59,114,185,.12)}.role-card.sel.t{border-color:var(--accent);background:rgba(79,195,176,.1);box-shadow:0 0 24px rgba(79,195,176,.12)}.btn{width:100%;padding:15px;border-radius:10px;border:none;font-size:1em;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(59,114,185,.2)}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(59,114,185,.3)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.tip{text-align:center;margin-top:16px;font-size:.78em;color:var(--muted);line-height:1.5}</style>
</head>
<body>
<div class="login-box">
<div class="logo"><div class="icon">📚</div><h1>家教工作台</h1><p>学生 · 教师 · 一体</p></div>
<label>你的姓名</label>
<input type="text" id="name" placeholder="输入姓名" autocomplete="off">
<label>选择身份</label>
<div class="role-select">
<div class="role-card" data-role="student" onclick="pickRole(this,'student')"><div class="r-icon">🎓</div><div class="r-title">我是学生</div><div class="r-desc">做练习 · 写评价 · 看错题</div></div>
<div class="role-card t" data-role="teacher" onclick="pickRole(this,'teacher')"><div class="r-icon">👨‍🏫</div><div class="r-title">我是老师</div><div class="r-desc">查成绩 · 看薄弱 · 出方案</div></div>
</div>
<div id="pwBox" style="display:none"><label>教师密码</label><input type="password" id="pw" placeholder="输入密码"></div>
<button class="btn" id="enterBtn" disabled onclick="enter()">进入工作台</button>
<div class="tip">数据自动同步 · 做完老师立刻看到</div>
</div>
<script>var role='';function pickRole(el,r){document.querySelectorAll('.role-card').forEach(function(c){c.classList.remove('sel')});el.classList.add('sel');role=r;document.getElementById('enterBtn').disabled=false;document.getElementById('pwBox').style.display=r==='teacher'?'block':'none'}window.enter=function(){var n=document.getElementById('name').value.trim();if(!n){alert('请输入姓名');return}if(role==='teacher'){if(document.getElementById('pw').value!=='123456'){alert('密码错误');return}}localStorage.setItem('ws_name',n);localStorage.setItem('ws_role',role);location.href=role==='teacher'?'teacher_desk.html':'student_desk.html'}</script>
</body>
</html>
