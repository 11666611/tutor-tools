<style>:root{--bg:#0f1923;--card:#1a2740;--primary:#3b72b9;--accent:#4fc3b0;--red:#e0556a;--orange:#e8913a;--purple:#7b8fce;--text:#e0e6ed;--muted:#7a8b9e;--border:#263548;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.2)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0d1520;color:var(--text);min-height:100vh;padding:20px;position:relative}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 60% 10%,rgba(59,114,185,.05) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(79,195,176,.03) 0%,transparent 50%);pointer-events:none;z-index:0}.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 0 20px;flex-wrap:wrap;gap:10px}.topbar .user{display:flex;align-items:center;gap:10px}.topbar .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:700;color:#0f1923}.topbar .name{font-weight:700;font-size:1.05em}.btn-sm{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border);background:0 0;color:var(--muted);font-size:.8em;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}.btn-sm:hover{border-color:var(--primary);color:#fff}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-danger{background:0 0;color:var(--red);border-color:var(--red)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow)}.card .c-n{font-size:1.8em;font-weight:800;color:#fff}.card .c-l{font-size:.73em;color:var(--muted)}.section{margin-bottom:22px}.section h3{font-size:.95em;font-weight:700;margin-bottom:12px;color:#fff}.stu-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}.stu-card:hover{border-color:var(--primary)}.stu-card .s-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.stu-card .s-name{font-weight:700;font-size:1em}.stu-card .s-stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.72em;font-weight:600}.tag-blue{background:rgba(59,114,185,.12);color:var(--primary)}.tag-green{background:rgba(79,195,176,.12);color:var(--accent)}.tag-red{background:rgba(224,85,106,.12);color:var(--red)}.tag-orange{background:rgba(232,145,58,.12);color:var(--orange)}.detail{display:none;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}.detail.show{display:block}.rec-item{padding:9px 0;border-bottom:1px dashed var(--border);font-size:.85em}.wtag{display:inline-block;background:rgba(224,85,106,.1);color:var(--red);padding:2px 7px;border-radius:5px;font-size:.73em;margin:2px}.wd-card{background:rgba(224,85,106,.04);border:1px solid rgba(224,85,106,.15);border-radius:10px;padding:12px 14px;margin:6px 0;font-size:.83em;line-height:1.6}.wd-card .wd-head{font-weight:700;color:var(--red);margin-bottom:6px;font-size:.9em}.wd-card .wd-q{color:var(--text);margin-bottom:6px;font-size:.85em}.wd-card .wd-wrong{color:var(--red);font-size:.82em}.wd-card .wd-right{color:var(--accent);font-size:.82em;font-weight:600}.teach-card{background:rgba(123,143,206,.05);border:1px solid rgba(123,143,206,.12);border-radius:10px;padding:14px;margin:6px 0}.teach-card h4{font-size:.84em;margin-bottom:4px}.teach-card p{font-size:.83em;color:var(--muted);line-height:1.7}.empty{text-align:center;padding:36px;color:var(--muted);font-size:.9em}.overall{background:rgba(79,195,176,.04);border:1px solid rgba(79,195,176,.12);border-radius:12px;padding:16px;margin-bottom:16px;font-size:.86em;line-height:1.8}.ws-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}.ws-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;transition:background .15s}.ws-header:hover{background:rgba(59,114,185,.04)}.ws-header .ws-tag{font-weight:700;font-size:.9em;color:var(--red)}.ws-header .ws-count{font-size:.78em;color:var(--muted)}.ws-body{display:none;padding:0 18px 14px;border-top:1px solid var(--border)}.ws-body.show{display:block}.ws-entry{background:rgba(224,85,106,.03);border:1px solid rgba(224,85,106,.1);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:.84em;line-height:1.6}.ws-entry .ws-student{font-weight:600;color:var(--orange);margin-bottom:2px}.ws-entry .ws-q{color:var(--text);margin:4px 0}.ws-entry .ws-answers{font-size:.9em;margin-top:4px}.ws-entry .ws-wrong{color:var(--red)}.ws-entry .ws-right{color:var(--accent);font-weight:600}.ws-empty{text-align:center;padding:30px;color:var(--muted);font-size:.88em}@media(max-width:480px){.cards{grid-template-columns:repeat(2,1fr)}.stu-card .s-top{flex-direction:column;align-items:flex-start}}</style></head>
<body><div class="wrap">
<div class="topbar"><div class="user"><div class="avatar">👨‍🏫</div><div class="name" id="u"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-sm btn-primary" onclick="refresh()">🔄 刷新</button><button class="btn-sm btn-danger" onclick="renew()">🆕 备份数据</button><button class="btn-sm" onclick="location.href='teacher_question_bank.html'">📝 题库</button><button class="btn-sm" onclick="location.href='parent_summary.html'">📋 课程反馈</button><button class="btn-sm" onclick="exportCSV()">📥 导出</button><button class="btn-sm" onclick="logout()">退出</button></div></div>

<div class="section"><h3>💡 因材施教建议</h3><div id="tt"></div></div>

<script>
var BLOB=localStorage.getItem('blob_url')||'https://jsonblob.com/api/jsonBlob/019fdab4-ce1e-7630-a111-3e1600fd8f63'
var BK='tutor_backup_data';
var name=localStorage.getItem('ws_name')||'老师';var role=localStorage.getItem('ws_role');if(role!=='teacher')location.href='index.html';document.getElementById('u').textContent=name;
var remedy={'空集的定义与判定':['{x|x²+2=0,x∈R}是空集？'],'子集个数公式·2ⁿ':['{1,2,3,4,5}子集？'],'真子集个数·2ⁿ-1':['{a,b,c,d}真子集？'],'集合相等·求参数':['A={2,a},B={a²-2,3},A=B,求a'],'含参集合为空集':['A={x|ax²+ax+1=0}=∅,求a']};
function gr(s){if(s>=90)return{g:'A+',c:'var(--accent)'};if(s>=75)return{g:'A',c:'var(--accent)'};if(s>=60)return{g:'B',c:'var(--orange)'};if(s>=40)return{g:'C',c:'var(--orange)'};return{g:'D',c:'var(--red)'}}
function refresh(){
fetch(BLOB).then(function(r){if(!r.ok)throw new Error('expired');return r.json()}).then(function(d){localStorage.setItem(BK,JSON.stringify(d));render(d)}).catch(function(e){var bk=localStorage.getItem(BK);if(bk){render(JSON.parse(bk));document.getElementById('ov').innerHTML+='<br><span style=\"color:var(--orange)\">⚠ 存储可能已过期，点击「备份数据」刷新</span>'}else{document.getElementById('sl').innerHTML='<div class=\"empty\">存储过期且无备份。请点击「🆕 备份数据」</div>'}})}
function render(d){var items=d.items||[];var qi=items.filter(function(e){return e.type==='quiz'});var ei=items.filter(function(e){return e.type==='eval'});var ns=[...new Set(items.map(function(e){return e.studentName}))];var aq=qi.length?Math.round(qi.reduce(function(s,e){return s+e.pct},0)/qi.length)+'%':'—';var ae=ei.length?(ei.reduce(function(s,e){return s+e.mastery*.6+e.focus*.4},0)/ei.length).toFixed(1):'—';var tw=qi.reduce(function(s,e){return s+(e.wrongDetails||[]).length},0);document.getElementById('sc').innerHTML='<div class=\"card\"><div class=\"c-n\" style=\"color:var(--primary)\">'+ns.length+'</div><div class=\"c-l\">学生总数</div></div><div class=\"card\"><div class=\"c-n\" style=\"color:var(--accent)\">'+qi.length+'</div><div class=\"c-l\">练习记录</div></div><div class=\"card\"><div class=\"c-n\" style=\"color:var(--orange)\">'+ei.length+'</div><div class=\"c-l\">评价记录</div></div><div class=\"card\"><div class=\"c-n\" style=\"color:var(--purple)\">'+aq+'</div><div class=\"c-l\">练习均分</div></div><div class=\"card\"><div class=\"c-n\" style=\"color:var(--red)\">'+tw+'</div><div class=\"c-l\">错题总数</div></div>';
var aw={};qi.forEach(function(q){if(!q.wrongDetails)return;q.wrongDetails.forEach(function(w){var t=w.tag||'其他';aw[t]=(aw[t]||0)+1})});var sw=Object.keys(aw).sort(function(a,b){return aw[b]-aw[a]}).slice(0,5);
document.getElementById('ov').innerHTML='📊 <b>全局：</b>'+ns.length+'名学生，'+qi.length+'次练习，'+ei.length+'次评价。'+(sw.length?'<br>📌 <b>高频薄弱：</b>'+sw.map(function(t){return t+'('+aw[t]+'次)'}).join('、'):'');
if(!ns.length){document.getElementById('sl').innerHTML='<div class=\"empty\">暂无数据</div>';document.getElementById('tt').innerHTML='';return}
document.getElementById('sl').innerHTML=ns.sort().map(function(n){var sq=qi.filter(function(e){return e.studentName===n});var se=ei.filter(function(e){return e.studentName===n});var qa=sq.length?Math.round(sq.reduce(function(s,e){return s+e.pct},0)/sq.length):null;var sw2={};sq.forEach(function(q){if(!q.wrongDetails)return;q.wrongDetails.forEach(function(w){sw2[w.tag||'其他']=(sw2[w.tag||'其他']||0)+1})});var sws=Object.keys(sw2).sort(function(a,b){return sw2[b]-sw2[a]}).slice(0,3);var id='d'+n.replace(/[\s#.]/g,'_');var h='<div class=\"stu-card\" onclick=\"toggle(\''+id+'\')\"><div class=\"s-top\"><span class=\"s-name\">🟢 '+n+'</span><div class=\"s-stats\">';if(qa!==null){var g=gr(qa);h+='<span class=\"tag\" style=\"background:'+g.c+'20;color:'+g.c+'\">练习'+qa+'%</span>'}h+='<span style=\"font-size:.78em;color:var(--muted)\">'+sq.length+'练 '+se.length+'评</span><button class=\"btn-sm\" style=\"border-color:var(--red);color:var(--red);margin-left:8px\" onclick=\"event.stopPropagation();delStu(\''+n+'\')\">🗑</button></div></div><div class=\"detail\" id=\"'+id+'\">';if(sq.length){h+='<div style=\"font-weight:600;color:var(--primary);margin-bottom:8px\">练习记录</div>';sq.slice(0,8).forEach(function(q){var g=gr(q.pct);h+='<div class=\"rec-item\"><div class=\"r-top\"><span>'+q.date+' · '+(q.topic||'—')+'</span><span style=\"font-weight:700;color:'+g.c+'\">'+q.pct+'% '+g.g+'</span></div>'+(q.wrongDetails&&q.wrongDetails.length?'<div style=\"margin-top:6px\">'+q.wrongDetails.map(function(w){var qt=w.text||'(题目未记录)';var ua=w.userAnswer||'未知';var ca=w.correctAnswer||'未知';return'<div class=\"wd-card\"><div class=\"wd-head\">❌ 第'+(w.num||'?')+'题 · '+(w.tag||'其他')+'</div><div class=\"wd-q\">📝 '+qt+'</div><div class=\"wd-wrong\">❌ 学生答案：'+ua+'</div><div class=\"wd-right\">✅ 正确答案：'+ca+'</div></div>'}).join('')+'</div>':'✅ 全对')+'</div>'})}if(sws.length){h+='<div style=\"font-weight:600;color:var(--red);margin:10px 0 6px\">薄弱 · 巩固</div>';sws.forEach(function(t){h+='<div style=\"margin-bottom:6px\"><span class=\"wtag\" style=\"font-size:.8em\">'+t+'（错'+sw2[t]+'次）</span>'+(remedy[t]?remedy[t].map(function(rq){return'<div style=\"font-size:.78em;color:var(--muted);margin-left:4px\">📝 '+rq+'</div>'}).join(''):'')+'</div>'})}if(se.length){h+='<div style=\"font-weight:600;color:var(--accent);margin:10px 0 6px\">评价</div>';se.slice(0,5).forEach(function(e){h+='<div class=\"rec-item\"><div class=\"r-top\"><span>'+e.date+' · '+e.subject+'</span><span style=\"font-weight:700\">'+'★'.repeat(e.mastery)+'☆'.repeat(5-e.mastery)+'</span></div><div style=\"font-size:.78em;color:var(--muted)\">掌握'+e.mastery+' 专注'+e.focus+(e.difficulties?' ⚠'+e.difficulties:'')+'</div></div>'})}h+='</div></div>';return h}).join('');
var tips=[];ns.forEach(function(n){var sq=qi.filter(function(e){return e.studentName===n});var qa=sq.length?Math.round(sq.reduce(function(s,e){return s+e.pct},0)/sq.length):null;var sw2={};sq.forEach(function(q){if(!q.wrongDetails)return;q.wrongDetails.forEach(function(w){sw2[w.tag||'其他']=(sw2[w.tag||'其他']||0)+1})});var sws=Object.keys(sw2).sort(function(a,b){return sw2[b]-sw2[a]});if(qa!==null&&qa<60)tips.push('<div class=\"teach-card\"><h4>🔴 '+n+'（均分'+qa+'%·重点）</h4><p>从基础概念入手，降低难度，建立信心。薄弱：'+(sws.length?sws.slice(0,3).join('、'):'—')+'</p></div>');else if(qa!==null&&qa<80)tips.push('<div class=\"teach-card\"><h4>🟡 '+n+'（均分'+qa+'%·提升）</h4><p>针对'+(sws.length?sws.slice(0,2).join('、'):'—')+'重点突破，增加中档题。</p></div>');else if(qa!==null)tips.push('<div class=\"teach-card\"><h4>🟢 '+n+'（均分'+qa+'%·拔高）</h4><p>挑战综合题和压轴题，培养思维深度。</p></div>')});document.getElementById('tt').innerHTML=tips.length?tips.join(''):'<div class=\"empty\">等待更多数据...</div>';
var comp='<div style=\"overflow-x:auto\"><table><tr><th>学生</th><th>次数</th><th>均分</th><th>评级</th><th>薄弱</th></tr>';ns.forEach(function(n){var sq=qi.filter(function(e){return e.studentName===n});var qa=sq.length?Math.round(sq.reduce(function(s,e){return s+e.pct},0)/sq.length):null;var sw2={};sq.forEach(function(q){if(!q.wrongDetails)return;q.wrongDetails.forEach(function(w){sw2[w.tag||'其他']=(sw2[w.tag||'其他']||0)+1})});var g=qa!==null?gr(qa):null;comp+='<tr><td><strong>'+n+'</strong></td><td>'+sq.length+'</td><td style=\"color:'+(g?g.c:'var(--muted)')+';font-weight:700\">'+(qa!==null?qa+'%':'—')+'</td><td>'+(g?'<span class=\"tag\" style=\"background:'+g.c+'20;color:'+g.c+'\">'+g.g+'</span>':'—')+'</td><td style=\"color:'+(Object.keys(sw2).length>0?'var(--red)':'var(--accent)')+'\">'+Object.keys(sw2).length+'</td></tr>'});comp+='</table></div>';document.getElementById('compare').innerHTML=comp;
var groups={high:[],mid:[],low:[]};ns.forEach(function(n){var sq=qi.filter(function(e){return e.studentName===n});var qa=sq.length?Math.round(sq.reduce(function(s,e){return s+e.pct},0)/sq.length):null;if(qa===null)return;if(qa>=80)groups.high.push(n);else if(qa>=60)groups.mid.push(n);else groups.low.push(n)});var gh='';if(groups.low.length)gh+='<div class=\"teach-card\"><h4>🔴 基础巩固组（'+groups.low.length+'人）</h4><p>'+groups.low.join('、')+'<br>建议：统一复习基础概念，降低难度，逐个突破。</p></div>';if(groups.mid.length)gh+='<div class=\"teach-card\"><h4>🟡 稳中求进组（'+groups.mid.length+'人）</h4><p>'+groups.mid.join('、')+'<br>建议：攻克各自薄弱点，培养解题规范。</p></div>';if(groups.high.length)gh+='<div class=\"teach-card\"><h4>🟢 拔高拓展组（'+groups.high.length+'人）</h4><p>'+groups.high.join('、')+'<br>建议：综合题和压轴题，培养一题多解。</p></div>';document.getElementById('groups').innerHTML=gh||'<div class=\"empty\">暂无数据</div>';renderWrongSummary(qi)}
function renderWrongSummary(qi){
  // 收集所有错题
  var allWrong=[];
  qi.forEach(function(q){
    if(!q.wrongDetails||!q.wrongDetails.length)return;
    q.wrongDetails.forEach(function(w){
      allWrong.push({
        student:q.studentName,
        date:q.date||'',
        topic:q.topic||'',
        num:w.num,
        tag:w.tag||'其他',
        text:w.text||'',
        userAnswer:w.userAnswer||'',
        correctAnswer:w.correctAnswer||''
      });
    });
  });
  if(!allWrong.length){document.getElementById('wrongSummary').innerHTML='<div class=\"ws-empty\">🎉 暂无错题记录</div>';return}
  // 按知识点分组
  var groups={};
  allWrong.forEach(function(w){
    if(!groups[w.tag])groups[w.tag]=[];
    groups[w.tag].push(w);
  });
  var tags=Object.keys(groups).sort(function(a,b){return groups[b].length-groups[a].length});
  var h='';
  tags.forEach(function(tag,i){
    var entries=groups[tag];
    var gid='wsg_'+i;
    h+='<div class=\"ws-group\"><div class=\"ws-header\" onclick=\"toggleWs(\''+gid+'\')\"><span class=\"ws-tag\">📌 '+tag+'</span><span class=\"ws-count\">'+entries.length+'次错误 · '+new Set(entries.map(function(e){return e.student})).size+'名学生</span></div>';
    h+='<div class=\"ws-body\" id=\"'+gid+'\">';
    entries.forEach(function(e){
      h+='<div class=\"ws-entry\"><div class=\"ws-student\">👤 '+e.student+' · '+e.date+'</div>';
      h+='<div class=\"ws-q\">📝 '+(e.text||'(题目未记录)')+'</div>';
      h+='<div class=\"ws-answers\"><span class=\"ws-wrong\">❌ '+e.userAnswer+'</span> → <span class=\"ws-right\">✅ '+e.correctAnswer+'</span></div>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  document.getElementById('wrongSummary').innerHTML=h;
}
window.toggleWs=function(id){var e=document.getElementById(id);if(e)e.classList.toggle('show')}
function toggle(id){var e=document.getElementById(id);if(e)e.classList.toggle('show')}
window.delStu=function(n){if(!confirm('删除学生「'+n+'」及其全部数据？'))return;fetch(BLOB).then(function(r){return r.json()}).then(function(d){if(!d.items)d.items=[];d.items=d.items.filter(function(e){return e.studentName!==n});fetch(BLOB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(){refresh()})})};
window.renew=function(){if(!confirm('续期存储？会创建新存储并复制全部数据（题库+学生记录），所有页面自动切换。'))return;fetch(BLOB).then(function(r){if(!r.ok)throw new Error('expired');return r.json()}).then(function(data){return fetch('https://jsonblob.com/api/jsonBlob',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){var loc=r.headers.get('Location');var id=loc.split('/').pop();var newUrl='https://jsonblob.com/api/jsonBlob/'+id;localStorage.setItem('blob_url',newUrl);localStorage.setItem(BK,JSON.stringify(data));alert('✅ 续期成功！\n新存储ID: '+id+'\n所有页面已自动切换，无需修改代码。');location.reload()})}).catch(function(e){alert('续期失败：'+e.message+'\n请稍后重试')})};
function exportCSV(){fetch(BLOB).then(function(r){return r.json()}).then(function(d){var items=d.items||[];var c='﻿类型,姓名,日期,主题,得分,题号,知识点,题目,学生答案,正确答案\n';items.forEach(function(e){if(e.type==='quiz'){var wds=e.wrongDetails||[];if(wds.length){wds.forEach(function(w){c+='练习,'+csvCell(e.studentName)+','+csvCell(e.date)+','+csvCell(e.topic)+','+e.pct+'%,'+csvCell(w.num||''),','+csvCell(w.tag||''),','+csvCell(w.text||''),','+csvCell(w.userAnswer||''),','+csvCell(w.correctAnswer||'')+'\n'})}else{c+='练习,'+csvCell(e.studentName)+','+csvCell(e.date)+','+csvCell(e.topic)+','+e.pct+'%,,,,,✅全对\n'}}else{c+='评价,'+csvCell(e.studentName)+','+csvCell(e.date)+','+csvCell(e.subject)+','+csvCell('掌握'+e.mastery+'专注'+e.focus)+','+csvCell(e.difficulties||''),','+csvCell(e.homework||'')+',,\n'}});var b=new Blob([c],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='数据.csv';a.click()})}
function csvCell(v){if(v===null||v===undefined)return'';var s=String(v);return s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0?'"'+s.replace(/"/g,'""')+'"':s}
function logout(){localStorage.removeItem('ws_name');localStorage.removeItem('ws_role');location.href='index.html'}refresh();</script>
</body></html>
